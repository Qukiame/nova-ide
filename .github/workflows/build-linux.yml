name: Build Linux binary

# Собирает standalone Linux ELF на ubuntu-latest.
# Полезно для проверки, что код не сломался на Linux.

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build NovaIDE on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system deps for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libxcb-cursor0 \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-util1 libxcb-xkb1 \
            libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0"

      - name: Smoke test (import + window creation)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "
          import importlib.util
          spec = importlib.util.spec_from_file_location('nova_ide', 'nova_ide.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          app = mod.QApplication([])
          w = mod.MainWindow()
          print('OK: window created, tabs:', w.editor_holder.count())
          "

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller nova_ide_win.spec --noconfirm --clean

      - name: Verify output
        run: |
          test -f dist/NovaIDE || (echo "NovaIDE not found" && exit 1)
          ls -lh dist/NovaIDE
          file dist/NovaIDE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaIDE-linux
          path: dist/NovaIDE
          if-no-files-found: error
          retention-days: 30
